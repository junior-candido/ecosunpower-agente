name: CI e merge automático

# Modelo confiável (testado: juntou 11 PRs): roda em TODO Pull Request pra main.
# Confere tipos (tsc) + testes (vitest); se tudo passar (verde), junta o PR na
# main sozinho (squash) e apaga a branch. Vermelho = não junta, autor conserta.
#
# (O modo "push cria o PR sozinho" foi tentado mas o robô não conseguia criar o
#  PR nesse repo — voltamos pro pull_request, que é à prova de bala. Fluxo: o
#  autor dá push e abre o PR (1 clique "Compare & pull request"); o resto é auto.)
#
# Produção continua MANUAL: só vai pro cliente quando o Junior Implanta.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  testar-e-juntar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Instalar o Chrome do Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Conferir tipos (tsc)
        run: npx tsc --noEmit

      - name: Rodar os testes
        run: npx vitest run

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir Supabase local (aplica as 79 migrations num banco zerado)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,inbucket

      - name: Teste de vazamento RLS (2 empresas fake — vermelho = vazou)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="${API_URL:-${SUPABASE_URL:-http://127.0.0.1:54321}}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$SUPABASE_ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-$SUPABASE_SERVICE_ROLE_KEY}"
          export SUPABASE_JWT_SECRET="super-secret-jwt-token-with-at-least-32-characters-long"
          npx tsx scripts/teste-vazamento-ci.ts

      - name: Juntar automaticamente (só se tudo passou)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
